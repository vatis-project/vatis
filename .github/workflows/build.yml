name: Build

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.filter.outputs.native }}
      dotnet: ${{ steps.filter.outputs.dotnet }}
    steps:
      - uses: actions/checkout@v5

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            native:
              - 'NativeAudio/**'
              - '.github/workflows/build.yml'
            dotnet:
              - 'vATIS.Desktop/**'
              - 'vATIS.Desktop.Tests/**'
              - 'Vatsim.Network/**'
              - 'vATIS.slnx'
              - '**/*.props'
              - '**/*.targets'
              - '**/global.json'
              - '.github/workflows/build.yml'

  build:
    needs: changes
    runs-on: ${{ matrix.os }}
    if: ${{ !contains(github.event.pull_request.title, '[skip ci]') && 
        !contains(github.event.pull_request.body, '[skip ci]') && 
        !contains(join(github.event.pull_request.labels.*.name, ','), 'skip ci') }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            platform: linux-x64
          - os: windows-latest
            platform: win-x64

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install .NET Core
        if: needs.changes.outputs.dotnet == 'true'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Cache NativeAudio
        id: native-cache
        if: needs.changes.outputs.native == 'true' || needs.changes.outputs.dotnet == 'true'
        uses: actions/cache@v4
        with:
          path: vATIS.Desktop/Voice/Audio/Native
          key: nativeaudio-${{ runner.os }}-${{ hashFiles('NativeAudio/**') }}

      - name: Install Dependencies
        if: ${{ steps.native-cache.outputs.cache-hit != 'true' && (needs.changes.outputs.native == 'true' || needs.changes.outputs.dotnet == 'true') && matrix.os == 'ubuntu-latest' }}
        run: |
          sudo apt update
          sudo apt install -y build-essential libcurl4-openssl-dev

      - name: Build NativeAudio
        if: ${{ steps.native-cache.outputs.cache-hit != 'true' && (needs.changes.outputs.native == 'true' || needs.changes.outputs.dotnet == 'true') }}
        run: |
          mkdir -p ./NativeAudio/out
          cmake -S ./NativeAudio -B ./NativeAudio/out -DCMAKE_BUILD_TYPE=Release
          cmake --build ./NativeAudio/out --config Release

      - name: Build client for macOS (ARM and x64)
        if: needs.changes.outputs.dotnet == 'true' && matrix.os == 'macos-latest'
        run: |
          for ARCH in osx-arm64 osx-x64; do
            echo "Building for platform: $ARCH"
            dotnet publish -c Release -r $ARCH -o ./build-$ARCH -p:UseAppHost=true -p:NoWarn=IL3000 ./vATIS.Desktop/vATIS.Desktop.csproj
          done

      - name: Build client (single platform)
        if: needs.changes.outputs.dotnet == 'true' && matrix.os != 'macos-latest'
        shell: bash
        run: |
          echo "Building for platform: ${{ matrix.platform }}"
          dotnet publish -c Release -r ${{ matrix.platform }} -o ./build-${{ matrix.platform }} -p:UseAppHost=true -p:NoWarn=IL3000 ./vATIS.Desktop/vATIS.Desktop.csproj

  test:
    needs: changes
    runs-on: ubuntu-latest
    if: ${{ needs.changes.outputs.dotnet == 'true' &&
        !contains(github.event.pull_request.title, '[skip ci]') &&
        !contains(github.event.pull_request.body, '[skip ci]') &&
        !contains(join(github.event.pull_request.labels.*.name, ','), 'skip ci') }}

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install .NET Core
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Cache NativeAudio
        id: native-cache
        if: needs.changes.outputs.native == 'true' || needs.changes.outputs.dotnet == 'true'
        uses: actions/cache@v4
        with:
          path: vATIS.Desktop/Voice/Audio/Native
          key: nativeaudio-${{ runner.os }}-${{ hashFiles('NativeAudio/**') }}

      - name: Install Dependencies
        if: ${{ steps.native-cache.outputs.cache-hit != 'true' && (needs.changes.outputs.native == 'true' || needs.changes.outputs.dotnet == 'true') }}
        run: |
          sudo apt update
          sudo apt install -y build-essential libcurl4-openssl-dev

      - name: Build NativeAudio
        if: ${{ steps.native-cache.outputs.cache-hit != 'true' && (needs.changes.outputs.native == 'true' || needs.changes.outputs.dotnet == 'true') }}
        run: |
          mkdir -p ./NativeAudio/out
          cmake -S ./NativeAudio -B ./NativeAudio/out -DCMAKE_BUILD_TYPE=Release
          cmake --build ./NativeAudio/out --config Release

      - name: Run tests
        run: dotnet test ./vATIS.Desktop.Tests/vATIS.Desktop.Tests.csproj -c Release
